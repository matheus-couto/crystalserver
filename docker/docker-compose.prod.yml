# Complemento do docker-compose.yml para producao.
#
# Uso (sempre os dois arquivos, nesta ordem):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# O compose base sobe banco, servidor de jogo e login-server. Este arquivo:
#   - desliga o login-server (imagem inexistente e redundante aqui)
#   - fecha a porta do banco para a internet
#   - acrescenta myacc, donate e caddy

name: crystalserver

services:
  # O banco so precisa ser alcancavel pelos outros containers. O compose base
  # publica 3306 em 0.0.0.0; aqui ela volta para o loopback, onde continua
  # acessivel por tunel SSH mas nao pela internet.
  database:
    # O compose base publica 3306 no host. Aqui a publicacao e removida por
    # inteiro: servidor, myacc e donate alcancam o banco pelo nome `database`
    # dentro da rede do compose, e nada precisa da porta no host.
    #
    # Para administrar de fora, use um container efemero na mesma rede:
    #   docker compose exec database mariadb -u root -p crandoria
    # ou um tunel SSH apontando para esse container.
    ports: !reset []
    # O timeout de 5s do compose base e curto demais aqui. Com 2 vCPU e o
    # servidor de jogo ocupando CPU, o healthcheck.sh estoura o prazo e o
    # banco e marcado unhealthy mesmo ja tendo logado "ready for connections",
    # o que trava a subida de todos os servicos que dependem dele.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 20s
      retries: 15
      start_period: 60s

  # A imagem crystalserver/login-server:latest nao existe no Docker Hub (o pull
  # e negado e derruba o `up` inteiro). Ela tambem seria redundante: o cliente
  # oficial procura o /login.php na porta 80, respondido pelo MyAAC.
  #
  # O profile mantem o servico declarado sem subir por padrao. Para ligar:
  #   docker compose --profile login-server up -d login
  login:
    profiles:
      - login-server

  server:
    environment:
      TZ: America/Sao_Paulo
    # TZ sozinho nao basta: nenhuma destas imagens traz o banco de fusos.
    # Montando o do host - que ja esta em America/Sao_Paulo - a hora do log
    # passa a bater com a de Brasilia sem reconstruir imagem nenhuma.
    volumes:
      - '/usr/share/zoneinfo:/usr/share/zoneinfo:ro'
      - '/etc/localtime:/etc/localtime:ro'
    # Roda o binario direto, sem o start.sh.
    #
    # O start.sh e um script interativo: ele vigia o servidor com
    #     while kill -0 $SERVER_PID; do read -t 1 -n 1 input; ...
    # esperando que alguem aperte 'q' para sair. Num container sem TTY o
    # stdin esta fechado, entao o `read -t 1` retorna na hora com EOF em vez
    # de aguardar um segundo, e o laco gira a toda velocidade: 99% de um core
    # so para vigiar um processo que usa 1,6%.
    #
    # O laco de restart dele tambem e redundante aqui, porque o proprio
    # compose ja tem restart: unless-stopped.
    #
    # De quebra some o pipe `| awk | tee` do start.sh, que deixava o
    # `docker compose logs` vazio: sem TTY o spdlog passa a usar buffer de
    # bloco e a saida ficava presa no pipe.
    entrypoint: ["/bin/crystalserver"]

    # PTY para o spdlog voltar a usar buffer de linha e a saida aparecer em
    # tempo real no `docker compose logs`.
    tty: true

    # O start.sh fazia `ulimit -c unlimited`; sem ele, preserva o core dump.
    ulimits:
      core: -1

    # O compose base publica apenas gameProtocolPort e statusProtocolPort do
    # .env (7172 e 7171). Falta a porta do protocolo de status.
    #
    # Com o sistema multiworld, quem responde ao status nao e o
    # statusProtocolPort do config.lua e sim o `port_status` da tabela
    # `worlds` - verificado na pratica: enviando o pacote de status, a 7173
    # devolve 557 bytes e a 7171 apenas aceita a conexao sem responder.
    # Sem publicar a 7173, o site marca o servidor como offline.
    ports:
      - '7173:7173'

  myacc:
    environment:
      TZ: America/Sao_Paulo
    build:
      context: ../myacc
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - '.env'
    networks:
      - crystalserver-net
    # Sem `ports`: quem fala com a internet e o Caddy. O Apache e alcancado
    # pelo nome `myacc` dentro da rede do compose.
    expose:
      - '80'
    volumes:
      - '/usr/share/zoneinfo:/usr/share/zoneinfo:ro'
      - '/etc/localtime:/etc/localtime:ro'
      # Bind mount, nao imagem: config.local.php e as imagens enviadas pelos
      # jogadores precisam sobreviver a um rebuild.
      - '../myacc:/var/www/html'
      # O MyAAC le arquivos do servidor a partir de server_path: config.lua,
      # data/vocations.xml, data/items/ e por ai. Montar so o config.lua
      # deixava o site em erro 500 procurando vocations.xml.
      - '../:/srv/crystalserver:ro'
    depends_on:
      database:
        condition: service_healthy

  donate:
    environment:
      TZ: America/Sao_Paulo
    # TZ sozinho nao basta: nenhuma destas imagens traz o banco de fusos.
    # Montando o do host - que ja esta em America/Sao_Paulo - a hora do log
    # passa a bater com a de Brasilia sem reconstruir imagem nenhuma.
    volumes:
      - '/usr/share/zoneinfo:/usr/share/zoneinfo:ro'
      - '/etc/localtime:/etc/localtime:ro'
    build:
      context: ../tools/asaas-donate
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - '../tools/asaas-donate/.env'
    networks:
      - crystalserver-net
    # Tambem sem `ports`: o webhook chega pelo Caddy, com TLS. O Asaas exige
    # HTTPS em producao, e assim a 3000 nao fica exposta.
    expose:
      - '3000'
    depends_on:
      database:
        condition: service_healthy

  painel:
    environment:
      TZ: America/Sao_Paulo
    build:
      context: ../tools/painel
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - '../tools/painel/.env'
    networks:
      - crystalserver-net
    # Sem `ports`: quem fala com o painel e o Caddy, que poe o TLS na frente.
    expose:
      - '3100'
    volumes:
      - '/usr/share/zoneinfo:/usr/share/zoneinfo:ro'
      - '/etc/localtime:/etc/localtime:ro'
      # Montagens estreitas de proposito. O painel edita script e nada mais -
      # nao enxerga config.lua, nem o .env, nem o codigo do site. Se ele for
      # comprometido, o estrago para onde a montagem termina.
      - '../data-crandoria:/srv/crystalserver/data-crandoria'
      - '../data:/srv/crystalserver/data'
      - '../backups:/opt/crandoria/backups'
      - '../logs/painel:/var/log/painel'
      # Socket do agente do host: e por aqui que sai reiniciar, ler log e
      # gerar dump. O socket do Docker nao entra no container.
      - '/run/crandoria-painel:/run/crandoria-painel'
    depends_on:
      database:
        condition: service_healthy

  caddy:
    environment:
      TZ: America/Sao_Paulo
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      - crystalserver-net
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - '/usr/share/zoneinfo:/usr/share/zoneinfo:ro'
      - '/etc/localtime:/etc/localtime:ro'
      - './Caddyfile:/etc/caddy/Caddyfile:ro'
      - 'caddy-data:/data'
      - 'caddy-config:/config'
      - 'caddy-logs:/var/log/caddy'
    depends_on:
      - myacc
      - donate

volumes:
  # Guarda os certificados. Sem este volume, cada `docker compose down` faria
  # o Caddy pedir certificado novo e bater no limite do Let's Encrypt.
  caddy-data:
  caddy-config:
  caddy-logs:
